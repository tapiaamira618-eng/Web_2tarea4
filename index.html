<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-yellow-300">

    <h1 class="text-red-500 text-3xl text-center">
        Hola mundo, probando Tailwind
    </h1>

    <div class="bg-yellow-400">
        <h2 class="text-blue-900 text-2xl text-center">
            Tailwind por: Cristal Pinaya Huaynoca
        </h2>
    </div>

    <!-- ARRIBA: REDONDOS -->

    <div class="container columns-3">

        <!-- BLUR -->
        <div>
            <h2>blur</h2>

            <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba"
                 class="w-40 h-40 rounded-full blur-md object-cover"
                 alt="Gato">
        </div>

        <!-- TRANSPARENTE -->
        <div>
            <h2>transparente</h2>

            <img src="https://images.unsplash.com/photo-1518791841217-8f162f1e1131"
                 class="w-40 h-40 rounded-full opacity-50 object-cover"
                 alt="Gato">
        </div>

        <!-- ESCALA -->
        <div>
            <h2>escala</h2>

            <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba"
                 class="w-40 h-40 rounded-full scale-75 object-cover"
                 alt="Gato">
        </div>

    </div>


    <!-- ABAJO: CUADRADOS -->

    <div class="container columns-3 mt-10">

        <!-- INTENSIDAD -->
        <div>
            <h2>intensidad</h2>

            <img src="https://images.unsplash.com/photo-1518791841217-8f162f1e1131"
                 class="w-40 h-40 brightness-150 object-cover"
                 alt="Gato">
        </div>

        <!-- OPACIDAD -->
        <div>
            <h2>opacidad</h2>

            <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba"
                 class="w-40 h-40 opacity-50 object-cover"
                 alt="Gato">
        </div>

        <!-- FILTRO -->
        <div>
            <h2>filtro</h2>

            <img src="https://images.unsplash.com/photo-1518791841217-8f162f1e1131"
                 class="w-40 h-40 grayscale object-cover"
                 alt="Gato">
        </div>

    </div>


    <div class="bg-yellow-400 mt-10">
        <h2 class="text-blue-900 text-center">
            Diseñado por:Niurka Tapia Kantuta
        </h2>
    </div>

</body>
</html>
